<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 220" fill="none">
  <defs>
    <!-- Outer Shield Glow / Stroke Gradient -->
    <linearGradient id="shieldBorderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4EECD5" />
      <stop offset="45%" stop-color="#22C38D" />
      <stop offset="75%" stop-color="#00D2B4" />
      <stop offset="100%" stop-color="#147B5A" />
    </linearGradient>

    <!-- Outer Bevel Highlight Gradient -->
    <linearGradient id="bevelHighlight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#A7F9EC" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#22C38D" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#0D2B20" stop-opacity="0.2" />
    </linearGradient>

    <!-- Shield Inner Background Gradient -->
    <linearGradient id="shieldBgGrad" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#0D1E17" />
      <stop offset="50%" stop-color="#08140F" />
      <stop offset="100%" stop-color="#040A07" />
    </linearGradient>

    <!-- Glowing Cyan/Mint Circuit Trace Gradient -->
    <linearGradient id="circuitGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3BF5CE" />
      <stop offset="100%" stop-color="#18B37E" />
    </linearGradient>

    <!-- 3D "W" Facet Gradients -->
    <linearGradient id="wFacetLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="40%" stop-color="#7CFAEB" />
      <stop offset="100%" stop-color="#26D69E" />
    </linearGradient>

    <linearGradient id="wFacetMid" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5BF2DC" />
      <stop offset="100%" stop-color="#139E6F" />
    </linearGradient>

    <linearGradient id="wFacetDark" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1CBF87" />
      <stop offset="100%" stop-color="#0A5A3E" />
    </linearGradient>

    <!-- Neon Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Ambient Glow Behind Shield -->
  <path
    d="M 100, 12 L 172, 38 L 186, 96 L 100, 208 L 14, 96 L 28, 38 Z"
    fill="none"
    stroke="#22C38D"
    stroke-width="12"
    opacity="0.25"
    filter="url(#softGlow)"
  />

  <!-- Shield Base Background Surface -->
  <path
    d="M 100, 14 L 170, 39 L 184, 95 L 100, 204 L 16, 95 L 30, 39 Z"
    fill="url(#shieldBgGrad)"
    stroke="url(#shieldBorderGrad)"
    stroke-width="5"
    stroke-linejoin="round"
  />

  <!-- Outer Beveled Flange Wings -->
  <polygon points="120,18 165,34 176,55 166,52 130,30" fill="url(#bevelHighlight)" opacity="0.7" />
  <polygon points="80,18 35,34 24,55 34,52 70,30" fill="url(#bevelHighlight)" opacity="0.4" />
  <polygon points="184,95 174,130 162,122 170,95" fill="url(#bevelHighlight)" opacity="0.6" />
  <polygon points="16,95 26,130 38,122 30,95" fill="url(#bevelHighlight)" opacity="0.4" />

  <!-- Inner Recessed Border Rim -->
  <path
    d="M 100, 25 L 158, 47 L 170, 94 L 100, 192 L 30, 94 L 42, 47 Z"
    fill="none"
    stroke="#164A37"
    stroke-width="2"
    stroke-dasharray="12 4"
    opacity="0.8"
  />

  <!-- Circuit Board Traces & Pads -->
  <g stroke="url(#circuitGrad)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.85">
    <path d="M 100, 28 L 100, 68" />
    <circle cx="100" cy="28" r="3" fill="#4EECD5" />

    <path d="M 85, 34 L 85, 62" />
    <circle cx="85" cy="34" r="2.5" fill="#4EECD5" />

    <path d="M 115, 34 L 115, 62" />
    <circle cx="115" cy="34" r="2.5" fill="#4EECD5" />

    <path d="M 70, 44 L 70, 64 L 76, 72" />
    <circle cx="70" cy="44" r="2" fill="#4EECD5" />

    <path d="M 130, 44 L 130, 64 L 124, 72" />
    <circle cx="130" cy="44" r="2" fill="#4EECD5" />

    <path d="M 40, 68 L 56, 68 L 66, 80" />
    <circle cx="40" cy="68" r="2.5" fill="#4EECD5" />

    <path d="M 36, 88 L 54, 88 L 64, 98" />
    <circle cx="36" cy="88" r="2.5" fill="#4EECD5" />

    <path d="M 40, 108 L 58, 108 L 68, 118" />
    <circle cx="40" cy="108" r="2.5" fill="#4EECD5" />

    <path d="M 50, 130 L 64, 130 L 74, 140" />
    <circle cx="50" cy="130" r="2" fill="#4EECD5" />

    <path d="M 64, 152 L 78, 142" />
    <circle cx="64" cy="152" r="2" fill="#4EECD5" />

    <path d="M 160, 68 L 144, 68 L 134, 80" />
    <circle cx="160" cy="68" r="2.5" fill="#4EECD5" />

    <path d="M 164, 88 L 146, 88 L 136, 98" />
    <circle cx="164" cy="88" r="2.5" fill="#4EECD5" />

    <path d="M 160, 108 L 142, 108 L 132, 118" />
    <circle cx="160" cy="108" r="2.5" fill="#4EECD5" />

    <path d="M 150, 130 L 136, 130 L 126, 140" />
    <circle cx="150" cy="130" r="2" fill="#4EECD5" />

    <path d="M 136, 152 L 122, 142" />
    <circle cx="136" cy="152" r="2" fill="#4EECD5" />

    <path d="M 88, 180 L 88, 160" />
    <circle cx="88" cy="180" r="2" fill="#4EECD5" />

    <path d="M 112, 180 L 112, 160" />
    <circle cx="112" cy="180" r="2" fill="#4EECD5" />

    <path d="M 100, 186 L 100, 168" />
    <circle cx="100" cy="186" r="2.5" fill="#4EECD5" />
  </g>

  <!-- The 3D Faceted W Monogram -->
  <g filter="url(#neonGlow)">
    <polygon points="52,74 65,74 81,142 74,154" fill="url(#wFacetLight)" />
    <polygon points="65,74 76,74 91,128 81,142" fill="url(#wFacetMid)" />
    <polygon points="81,142 91,128 100,90 96,154" fill="url(#wFacetLight)" />
    <polygon points="100,90 109,128 119,142 104,154" fill="url(#wFacetDark)" />
    <polygon points="124,74 135,74 119,142 109,128" fill="url(#wFacetMid)" />
    <polygon points="135,74 148,74 126,154 119,142" fill="url(#wFacetDark)" />

    <!-- Centerlines -->
    <polyline points="58,74 77,148 100,90 123,148 142,74" fill="none" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.9" />
  </g>

  <!-- Bottom Crest Bevel -->
  <polygon points="100,204 88,188 112,188" fill="url(#bevelHighlight)" opacity="0.8" />
</svg>

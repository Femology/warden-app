<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 180" fill="none">
  <defs>
    <linearGradient id="lockupTextGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="70%" stop-color="#EAF2ED" />
      <stop offset="100%" stop-color="#A7F9EC" />
    </linearGradient>

    <!-- Shield Gradients -->
    <linearGradient id="shieldBorderGradDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4EECD5" />
      <stop offset="45%" stop-color="#22C38D" />
      <stop offset="100%" stop-color="#147B5A" />
    </linearGradient>

    <linearGradient id="shieldBgGradDark" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#0D1E17" />
      <stop offset="100%" stop-color="#040A07" />
    </linearGradient>

    <linearGradient id="circuitGradDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3BF5CE" />
      <stop offset="100%" stop-color="#18B37E" />
    </linearGradient>

    <linearGradient id="wFacetLightDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="40%" stop-color="#7CFAEB" />
      <stop offset="100%" stop-color="#26D69E" />
    </linearGradient>

    <linearGradient id="wFacetMidDark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5BF2DC" />
      <stop offset="100%" stop-color="#139E6F" />
    </linearGradient>

    <linearGradient id="wFacetDarkDark" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1CBF87" />
      <stop offset="100%" stop-color="#0A5A3E" />
    </linearGradient>
  </defs>

  <!-- Left: Shield Emblem -->
  <g transform="translate(15, 8) scale(0.74)">
    <path
      d="M 100, 14 L 170, 39 L 184, 95 L 100, 204 L 16, 95 L 30, 39 Z"
      fill="url(#shieldBgGradDark)"
      stroke="url(#shieldBorderGradDark)"
      stroke-width="5"
      stroke-linejoin="round"
    />

    <!-- Circuit Traces -->
    <g stroke="url(#circuitGradDark)" stroke-width="2.5" stroke-linecap="round" opacity="0.9">
      <path d="M 100, 28 L 100, 68" /><circle cx="100" cy="28" r="3" fill="#4EECD5" />
      <path d="M 85, 34 L 85, 62" /><circle cx="85" cy="34" r="2.5" fill="#4EECD5" />
      <path d="M 115, 34 L 115, 62" /><circle cx="115" cy="34" r="2.5" fill="#4EECD5" />
      <path d="M 40, 68 L 56, 68 L 66, 80" /><circle cx="40" cy="68" r="2.5" fill="#4EECD5" />
      <path d="M 36, 88 L 54, 88 L 64, 98" /><circle cx="36" cy="88" r="2.5" fill="#4EECD5" />
      <path d="M 160, 68 L 144, 68 L 134, 80" /><circle cx="160" cy="68" r="2.5" fill="#4EECD5" />
      <path d="M 164, 88 L 146, 88 L 136, 98" /><circle cx="164" cy="88" r="2.5" fill="#4EECD5" />
      <path d="M 50, 130 L 64, 130 L 74, 140" /><circle cx="50" cy="130" r="2" fill="#4EECD5" />
      <path d="M 150, 130 L 136, 130 L 126, 140" /><circle cx="150" cy="130" r="2" fill="#4EECD5" />
      <path d="M 100, 186 L 100, 168" /><circle cx="100" cy="186" r="2.5" fill="#4EECD5" />
    </g>

    <!-- 3D "W" -->
    <polygon points="52,74 65,74 81,142 74,154" fill="url(#wFacetLightDark)" />
    <polygon points="65,74 76,74 91,128 81,142" fill="url(#wFacetMidDark)" />
    <polygon points="81,142 91,128 100,90 96,154" fill="url(#wFacetLightDark)" />
    <polygon points="100,90 109,128 119,142 104,154" fill="url(#wFacetDarkDark)" />
    <polygon points="124,74 135,74 119,142 109,128" fill="url(#wFacetMidDark)" />
    <polygon points="135,74 148,74 126,154 119,142" fill="url(#wFacetDarkDark)" />
    <polyline points="58,74 77,148 100,90 123,148 142,74" fill="none" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" opacity="0.9" />
  </g>

  <!-- Right: WARDEN Wordmark -->
  <text
    x="180"
    y="108"
    font-family="'Bricolage Grotesque', 'Instrument Sans', system-ui, sans-serif"
    font-weight="800"
    font-size="64"
    letter-spacing="3.5"
    fill="url(#lockupTextGrad)"
  >
    WARDEN
  </text>
  
  <text
    x="184"
    y="136"
    font-family="'Instrument Sans', system-ui, sans-serif"
    font-weight="600"
    font-size="14"
    letter-spacing="5"
    fill="#93A99C"
  >
    SECURITY OPERATING SYSTEM
  </text>
</svg>

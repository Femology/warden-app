<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 180" fill="none">
  <defs>
    <!-- Light Mode Shield Gradients -->
    <linearGradient id="shieldBorderGradLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22C38D" />
      <stop offset="60%" stop-color="#1C9C73" />
      <stop offset="100%" stop-color="#0E5E44" />
    </linearGradient>

    <linearGradient id="shieldBgGradLight" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#F2EDE0" />
      <stop offset="100%" stop-color="#E5DDCA" />
    </linearGradient>

    <linearGradient id="circuitGradLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1C9C73" />
      <stop offset="100%" stop-color="#0B563D" />
    </linearGradient>

    <linearGradient id="wFacetLightLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22C38D" />
      <stop offset="50%" stop-color="#1C9C73" />
      <stop offset="100%" stop-color="#0F664A" />
    </linearGradient>

    <linearGradient id="wFacetMidLight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1C9C73" />
      <stop offset="100%" stop-color="#137B59" />
    </linearGradient>

    <linearGradient id="wFacetDarkLight" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#137B59" />
      <stop offset="100%" stop-color="#094A34" />
    </linearGradient>
  </defs>

  <!-- Left: Shield Emblem -->
  <g transform="translate(15, 8) scale(0.74)">
    <path
      d="M 100, 14 L 170, 39 L 184, 95 L 100, 204 L 16, 95 L 30, 39 Z"
      fill="url(#shieldBgGradLight)"
      stroke="url(#shieldBorderGradLight)"
      stroke-width="5"
      stroke-linejoin="round"
    />

    <!-- Circuit Traces -->
    <g stroke="url(#circuitGradLight)" stroke-width="2.5" stroke-linecap="round" opacity="0.9">
      <path d="M 100, 28 L 100, 68" /><circle cx="100" cy="28" r="3" fill="#1C9C73" />
      <path d="M 85, 34 L 85, 62" /><circle cx="85" cy="34" r="2.5" fill="#1C9C73" />
      <path d="M 115, 34 L 115, 62" /><circle cx="115" cy="34" r="2.5" fill="#1C9C73" />
      <path d="M 40, 68 L 56, 68 L 66, 80" /><circle cx="40" cy="68" r="2.5" fill="#1C9C73" />
      <path d="M 36, 88 L 54, 88 L 64, 98" /><circle cx="36" cy="88" r="2.5" fill="#1C9C73" />
      <path d="M 160, 68 L 144, 68 L 134, 80" /><circle cx="160" cy="68" r="2.5" fill="#1C9C73" />
      <path d="M 164, 88 L 146, 88 L 136, 98" /><circle cx="164" cy="88" r="2.5" fill="#1C9C73" />
      <path d="M 50, 130 L 64, 130 L 74, 140" /><circle cx="50" cy="130" r="2.5" fill="#1C9C73" />
      <path d="M 150, 130 L 136, 130 L 126, 140" /><circle cx="150" cy="130" r="2.5" fill="#1C9C73" />
      <path d="M 100, 186 L 100, 168" /><circle cx="100" cy="186" r="2.5" fill="#1C9C73" />
    </g>

    <!-- 3D "W" -->
    <polygon points="52,74 65,74 81,142 74,154" fill="url(#wFacetLightLight)" />
    <polygon points="65,74 76,74 91,128 81,142" fill="url(#wFacetMidLight)" />
    <polygon points="81,142 91,128 100,90 96,154" fill="url(#wFacetLightLight)" />
    <polygon points="100,90 109,128 119,142 104,154" fill="url(#wFacetDarkLight)" />
    <polygon points="124,74 135,74 119,142 109,128" fill="url(#wFacetMidLight)" />
    <polygon points="135,74 148,74 126,154 119,142" fill="url(#wFacetDarkLight)" />
    <polyline points="58,74 77,148 100,90 123,148 142,74" fill="none" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" opacity="0.9" />
  </g>

  <!-- Right: WARDEN Wordmark -->
  <text
    x="180"
    y="108"
    font-family="'Bricolage Grotesque', 'Instrument Sans', system-ui, sans-serif"
    font-weight="800"
    font-size="64"
    letter-spacing="3.5"
    fill="#1D2A22"
  >
    WARDEN
  </text>
  
  <text
    x="184"
    y="136"
    font-family="'Instrument Sans', system-ui, sans-serif"
    font-weight="600"
    font-size="14"
    letter-spacing="5"
    fill="#5C6B60"
  >
    SECURITY OPERATING SYSTEM
  </text>
</svg>
